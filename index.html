<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QA Nexus AI turns a specification into reviewable test cases and a Playwright suite that reuses your own test framework."
    />
    <title>QA Nexus AI — Test Case &amp; Playwright Suite Generator</title>
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong ground colour. Mirrors src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('qa_nexus_theme')
          var dark =
            stored === 'midnight' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
